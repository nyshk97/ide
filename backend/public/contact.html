<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>お問い合わせ — PolePole</title>
  <link rel="canonical" href="https://polepole.dev/contact">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="logo">PolePole</a>
      <nav class="site-nav">
        <a href="/#features">特徴</a>
        <a href="/#pricing">価格</a>
        <a href="/#download">ダウンロード</a>
        <a href="/changelog">更新情報</a>
        <span class="lang-switch">
          <span class="lang-current">JA</span>
          <span class="lang-divider">·</span>
          <a href="/en/contact" class="lang-link">EN</a>
        </span>
      </nav>
    </div>
  </header>

  <main class="legal">
    <h1>お問い合わせ</h1>
    <p>下記フォームよりお問い合わせください。内容を確認のうえ、ご記入のメールアドレス宛にご返信いたします。</p>
    <p>サポート、ご返金、個人情報の開示・訂正・削除等の請求、その他のご連絡もすべて本フォームよりお受けしています。</p>

    <form class="contact-form" action="https://hyperform.jp/api/tlzJV69s" method="POST">
      <label for="contact-name">お名前 <span class="optional">(任意)</span></label>
      <input id="contact-name" name="name" type="text" autocomplete="name">

      <label for="contact-email">メールアドレス <span class="required">(必須)</span></label>
      <input id="contact-email" name="email" type="email" required autocomplete="email">

      <label for="contact-subject">件名 <span class="optional">(任意)</span></label>
      <input id="contact-subject" name="subject" type="text">

      <label for="contact-body">お問い合わせ内容 <span class="required">(必須)</span></label>
      <textarea id="contact-body" name="body" rows="8" required></textarea>

      <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" class="contact-form-hp">

      <button type="submit">送信する</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div>
        <a href="/legal/terms.html">利用規約</a>
        <a href="/legal/privacy.html">プライバシーポリシー</a>
        <a href="/legal/tokushoho.html">特定商取引法に基づく表記</a>
        <a href="/contact">お問い合わせ</a>
        <a href="/changelog">更新情報</a>
      </div>
      <div class="lang-switch">
        <span class="lang-current">JA</span>
        <span class="lang-divider">·</span>
        <a href="/en/contact" class="lang-link">EN</a>
      </div>
      <div class="copy">© 2026 PolePole</div>
    </div>
  </footer>
</body>
</html>
