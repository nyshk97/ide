name = "polepole-backend"
main = "src/index.ts"
compatibility_date = "2026-05-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers v4 では env (--env production など) を使うと bindings は継承されず、
# その env 配下に書いたものしか見えない。なので「development (env なし)」と
# 「production (--env production)」の両方で同じ shape の binding を明示する。
#
# secret 系 (STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET / RESEND_API_KEY /
# LICENSE_SIGNING_PRIVATE_KEY / EXPECTED_PRICE_ID / EXPECTED_PAYMENT_LINK_ID) は
# wrangler.toml に書かず、ローカルは .dev.vars、本番は `wrangler secret put` で投入する。

# ===== development (`wrangler dev` / 引数なし deploy はここを見る) =====
[vars]
EXPECTED_AMOUNT = "11800"
EXPECTED_CURRENCY = "jpy"
RESEND_ENABLED = "true"

# LP / 法的ページ等を Workers Assets として配信する。
# Worker のルート (src/index.ts) で hit しない GET だけ assets が serve する
# (`run_worker_first = false` がデフォルト)。動的ルート ( /thanks /stripe-webhook /v1/* /healthz )
# は Worker 側で先に当たるので影響なし。
[assets]
directory = "./public"
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "polepole-licenses"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[ratelimits]]
name = "RATE_LIMITER_ACTIVATE"
namespace_id = "1001"
simple = { limit = 10, period = 10 }

[[ratelimits]]
name = "RATE_LIMITER_RESEND"
namespace_id = "1002"
simple = { limit = 3, period = 60 }

# ===== production (`wrangler deploy --env production`) =====
# 同じ shape を全部明示する。Price ID / Payment Link ID は本番値が決まり次第、
# `wrangler secret put EXPECTED_PRICE_ID --env production` 等で投入する想定。
[env.production]
name = "polepole-backend"

# polepole.dev (apex) を 1 Worker で受ける構成。LP / 法的ページ / /stripe-webhook /
# /thanks / /v1/license/* / /healthz をすべてここで処理する。subdomain `api.polepole.dev`
# は不要 (Workers Assets 統合)。Cloudflare DNS 側で polepole.dev を Cloudflare proxy
# (orange cloud) にしてある前提で、wrangler が route を当てに行く。
routes = [
  { pattern = "polepole.dev/*", zone_name = "polepole.dev" },
]

[env.production.vars]
EXPECTED_AMOUNT = "11800"
EXPECTED_CURRENCY = "jpy"
RESEND_ENABLED = "true"

[env.production.assets]
directory = "./public"
not_found_handling = "404-page"

[[env.production.d1_databases]]
binding = "DB"
database_name = "polepole-licenses-prod"
# 2026-05-24: `wrangler d1 create polepole-licenses-prod` (APAC region) で発行
database_id = "291d3fd4-3a52-4fc3-a60d-edff2d94473a"
migrations_dir = "migrations"

[[env.production.ratelimits]]
name = "RATE_LIMITER_ACTIVATE"
namespace_id = "2001"
simple = { limit = 10, period = 10 }

[[env.production.ratelimits]]
name = "RATE_LIMITER_RESEND"
namespace_id = "2002"
simple = { limit = 3, period = 60 }
